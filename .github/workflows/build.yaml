name: Test and Build

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']

env:
  BUN_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Run linting
        run: bunx nx run-many --target=lint --all

      - name: Build all projects
        run: bunx nx run-many --target=build --all
